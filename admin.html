<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración - Colectivo Celia</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Oculta todo hasta que admin.js confirme que el usuario
       tiene permiso. Evita el "flash" del panel antes de
       redirigir a alguien que no es el dueño de esta tienda. */
    body {
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div id="auth-checking" style="visibility:visible;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;">
    Verificando acceso...
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Colectivo Celia">
        Colectivo <span class="logo-accent">Celia</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="btn btn-outline">Ver tienda</a>
        <button id="logout-btn" class="btn btn-danger">Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <section class="page-title">
      <h1>Panel de administración</h1>
      <p>Gestiona los productos de la tienda.</p>
    </section>

    <section class="admin-layout">

      <div class="admin-form-card">
        <h2 id="form-title">Agregar producto</h2>

        <form id="product-form" class="form">
          <div class="form-group">
            <label for="product-name">Nombre</label>
            <input type="text" id="product-name" name="name" required placeholder="Nombre del producto">
          </div>

          <div class="form-group">
            <label for="product-description">Descripción</label>
            <textarea id="product-description" name="description" rows="3" placeholder="Descripción del producto"></textarea>
          </div>

          <div class="form-group">
            <label for="product-price">Precio</label>
            <input type="number" id="product-price" name="price" min="0" step="0.01" required placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="product-image">Imagen</label>
            <input type="file" id="product-image" name="image" accept="image/*">
          </div>

          <p id="form-message"></p>

          <div class="form-actions">
            <button type="submit" id="submit-product-btn" class="btn btn-primary">Agregar producto</button>
            <button type="button" id="cancel-edit-btn" class="btn btn-outline" style="display:none;">Cancelar</button>
          </div>
        </form>
      </div>

      <div class="admin-list-card">
        <h2>Productos existentes</h2>
        <div id="admin-products-list" class="admin-products-list">
          <p class="loading">Cargando productos...</p>
        </div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Colectivo Celia. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store-resolver.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
