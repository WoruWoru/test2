<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de productos | Panel Seoul Snacks</title>
<meta name="description" content="Panel de administración de Seoul Snacks para crear, editar y eliminar productos del catálogo.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo.png" type="image/png">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-side">
    <a class="brand" href="../index.html">
      <img src="../assets/logo.png" alt="Seoul Snacks">
      <span class="brand-name">Seoul<span>Snacks</span></span>
    </a>
    <nav class="admin-nav">
      <a class="active" href="index.html">Productos</a>
      <a href="../catalogo.html">Ver tienda</a>
      <a href="#" id="logout-side">Cerrar sesión</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-head">
      <div>
        <h1>Gestión de <span class="text-red">productos</span></h1>
        <p id="admin-user">Panel de administración</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" id="btn-new">+ Nuevo producto</button>
        <button class="btn btn-ghost" id="logout-top">Salir</button>
      </div>
    </div>

    <div id="config-alert" class="alert alert-info hidden" style="margin-bottom:22px">
      Supabase aún no está conectado. Configura <code>js/supabase-config.js</code> para gestionar productos reales.
    </div>

    <div class="stats">
      <div class="stat"><strong id="stat-total">—</strong><span>Productos</span></div>
      <div class="stat"><strong id="stat-active">—</strong><span>Activos</span></div>
      <div class="stat"><strong id="stat-featured">—</strong><span>Destacados</span></div>
    </div>

    <div class="toolbar">
      <input class="field" id="a-search" type="search" placeholder="Filtrar por nombre o categoría…">
      <select class="field" id="a-status">
        <option value="">Todos los estados</option>
        <option value="active">Solo activos</option>
        <option value="inactive">Solo inactivos</option>
      </select>
      <button class="btn btn-dark" id="btn-reload">Recargar</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th><th>Producto</th><th>Categoría</th><th>Precio</th>
            <th>Estado</th><th style="text-align:right">Acciones</th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="6"><div class="state"><div class="spinner"></div>Cargando…</div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal producto -->
<div class="modal-backdrop hidden" id="product-modal">
  <form class="modal" id="product-form">
    <div class="modal-head">
      <h2 id="modal-title">Nuevo producto</h2>
      <button class="icon-btn" type="button" id="modal-close" aria-label="Cerrar">×</button>
    </div>
    <div class="modal-body">
      <div id="form-alert" class="alert alert-error hidden"></div>
      <input type="hidden" id="p-id">

      <div class="grid-2">
        <div><label class="label" for="p-name">Nombre *</label>
          <input class="field" id="p-name" required placeholder="Buldak Ramen Picante"></div>
        <div><label class="label" for="p-category">Categoría</label>
          <input class="field" id="p-category" placeholder="Ramyun"></div>
      </div>

      <div>
        <label class="label" for="p-price">Precio *</label>
        <input class="field" id="p-price" type="number" step="0.01" min="0" required placeholder="0.00">
      </div>

      <div>
        <label class="label" for="p-image">URL de imagen</label>
        <input class="field" id="p-image" placeholder="https://…">
        <label class="label" for="p-file" style="margin-top:10px">o subir archivo al bucket</label>
        <input class="field" id="p-file" type="file" accept="image/*">
      </div>

      <div>
        <label class="label" for="p-description">Descripción</label>
        <textarea class="field" id="p-description" placeholder="Sabor, presentación, ingredientes…"></textarea>
      </div>

      <div style="display:flex;gap:22px;flex-wrap:wrap">
        <label style="display:flex;gap:8px;align-items:center">
          <input type="checkbox" id="p-active" checked> <span>Activo</span></label>
        <label style="display:flex;gap:8px;align-items:center">
          <input type="checkbox" id="p-featured"> <span>Destacado</span></label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-dark" type="button" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" type="submit" id="modal-save">Guardar</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/store-resolver.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
