<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — ラーメンお菓子</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header site-header-simple">
  <div class="header-inner-simple">
    <a href="index.html" class="simple-logo">
      <span class="simple-logo-jp">ラーメン<span class="accent">お菓子</span></span>
    </a>
    <nav class="nav">
      <a href="index.html" class="btn btn-outline">Volver a la tienda</a>
    </nav>
  </div>
</header>

<main class="auth-content">
  <div class="auth-card">
    <h1>Iniciar sesión</h1>
    <p class="auth-subtitle">Acceso exclusivo para administradores.</p>

    <p id="config-alert" class="error hidden">
      Supabase no está configurado todavía. Edita js/supabase-config.js con tu URL y anon key.
    </p>

    <form id="login-form" class="form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="admin@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      <p id="login-alert" class="error hidden"></p>

      <button type="submit" id="login-btn" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>
  </div>
</main>

<footer class="site-footer site-footer-simple">
  <p class="copy">© 2026 ラーメンお菓子 · Proyecto de pruebas</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/store-resolver.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
