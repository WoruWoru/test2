<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Colectivo Celia</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Colectivo Celia">
        Colectivo <span class="logo-accent">Celia</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="btn btn-outline">Volver a la tienda</a>
      </nav>
    </div>
  </header>

  <main class="container main-content auth-content">
    <div class="auth-card">
      <h1>Iniciar sesión</h1>
      <p class="auth-subtitle">Acceso exclusivo para administradores.</p>

      <form id="login-form" class="form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required placeholder="admin@correo.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <p id="login-error" class="error"></p>

        <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Colectivo Celia. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store-resolver.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
